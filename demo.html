<!doctype html>
<html lang="zh-CN" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="CampusNav 3D 的 3D 校园导航原型：室外三维校园、可寻路路网与建筑信息浏览。" />
    <meta name="theme-color" content="#f7f9fa" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <title>3D 校园导航原型 · CampusNav 3D</title>
    <script>
      // 首屏前跑：① 原生壳（?shell=1）里只承载地图，隐藏站点导航；
      // ② 回放深浅主题，避免样式表加载后才切主题造成的闪白（docs/design-overview-v2.md §6.4）。
      ;(function () {
        try {
          if (new URLSearchParams(location.search).get('shell') === '1') {
            document.documentElement.dataset.shell = '1'
          }
          var stored = localStorage.getItem('campusnav-theme')
          var dark = stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.dataset.theme = dark ? 'dark' : 'light'
          var meta = document.querySelector('meta[name="theme-color"]')
          if (meta) meta.setAttribute('content', dark ? '#0d1417' : '#f7f9fa')
        } catch (e) {}
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
