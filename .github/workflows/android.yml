name: Android

on:
  push:
    branches: [main]
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'apps/android/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 接受 Android SDK 许可
        run: |
          echo "SDK: ${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          yes | "${ANDROID_HOME:-$ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: 主题硬编码检查
        run: bash tools/assert-theme-tokens.sh

      - name: 组装 Debug APK 与单测
        run: gradle :app:assembleDebug :app:testDebugUnitTest --no-daemon --stacktrace

      # debug 包不签名、不对外发布，只作为可下载的构建产物留档（14 天）。
      - name: 产物信息
        run: |
          ls -lh app/build/outputs/apk/debug/
          sha256sum app/build/outputs/apk/debug/*.apk | tee /tmp/apk-sha256.txt
          {
            echo '### Debug APK'
            echo ''
            echo '```'
            cat /tmp/apk-sha256.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 上传 Debug APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: campus-nav-debug-apk
          path: |
            apps/android/app/build/outputs/apk/debug/*.apk
            apps/android/app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 14
